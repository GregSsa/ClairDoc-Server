[project]
name = "clairdoc-server"
version = "0.1.0"
description = "Serveur local OCR et documentaire de ClairDoc"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GregSsa" }]
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2,<3",
  "pypdf>=6,<7",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
clairdoc-server = "clairdoc_server.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clairdoc_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
